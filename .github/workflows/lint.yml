name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install Ruff
      run: pip install ruff==0.3.3
      
    - name: Run Ruff
      run: ruff check .
      
    - name: Run Shellcheck
      run: shellcheck setup.sh
