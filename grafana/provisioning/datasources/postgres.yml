# Provisioned so the datasource UID is stable and known. The committed dashboard
# references this uid directly, which is what makes the dashboard portable --
# a hand-created datasource gets a random uid that only exists on one machine.
apiVersion: 1

datasources:
  - name: FinOps Postgres
    uid: finops-postgres
    type: grafana-postgresql-datasource
    access: proxy
    # Service name, not localhost: Grafana resolves this on the compose network.
    # `localhost` inside the container is Grafana itself, and host.docker.internal
    # does not exist on Linux without extra_hosts.
    url: postgres:5432
    database: finops_db
    user: finops
    isDefault: true
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1500
    secureJsonData:
      password: finops_password
